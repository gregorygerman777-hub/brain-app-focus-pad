<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c0b;--surface:#161310;--surface2:#1c1814;--text:#e8e0d5;--muted:#8a7d6e;--accent:#c9a96e;--border:#2a2420;--ok:#7fc99c;--err:#e07a6a;--font-body:system-ui,-apple-system,sans-serif;--font-display:Lora,Georgia,serif;--font-mono:"DM Mono",ui-monospace,monospace}
@media (prefers-color-scheme: light){:root:not([data-synced]){--bg:#f4ede0;--surface:#ebe2d2;--surface2:#e0d6c2;--text:#1a1812;--muted:#6b5f52;--accent:#8a6e3c;--border:#c9b896;--ok:#2f7d4f;--err:#b5452f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--font-body)}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1{font-family:var(--font-display);font-size:28px;margin:0 0 8px;font-weight:600}
p.lead{color:var(--muted);margin:0 0 24px}
label{display:block;font-family:var(--font-mono);font-size:12px;color:var(--muted);margin:16px 0 8px;letter-spacing:.02em}
input,select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font:inherit}
textarea{min-height:160px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
button{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:8px 16px;font-family:var(--font-mono);font-size:13px;cursor:pointer}
button.primary{background:var(--accent);color:var(--bg)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:16px}
.status{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-height:24px;margin-top:8px}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.out{white-space:pre-wrap}
.sources{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:8px}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{border-top:1px solid var(--border);padding:8px 0}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-weight:500}
th,td{text-align:left;padding:8px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<main>
<h1>Focus Pad</h1>
<p class="lead">Just you and the page. Saves as you type in this browser.</p>
<div class="row" style="margin-top:0"><button id="timer">Start 25 min</button><span class="muted" id="clock"></span><span class="muted" id="count">0 words</span></div>
<textarea id="pad" style="min-height:60vh;margin-top:16px;font-size:17px;line-height:1.7" placeholder="Start writing"></textarea>
<div class="row"><button class="primary" id="keep">Save to memory</button><button id="dl">Download .md</button><button id="clear">Clear</button></div>
<div class="status" id="status"></div>
</main>
<script>
// Follow the console's theme and fonts (same-origin iframe), live.
(function () {
  const KEYS = ['--bg', '--surface', '--surface2', '--text', '--muted', '--accent', '--border', '--font-body', '--font-display', '--font-mono'];
  function apply() {
    try {
      const cs = getComputedStyle(window.parent.document.documentElement);
      const root = document.documentElement;
      let got = false;
      KEYS.forEach((k) => { const v = cs.getPropertyValue(k).trim(); if (v) { root.style.setProperty(k, v); got = true; } });
      if (got) root.dataset.synced = '1';
    } catch {}
  }
  if (window.parent !== window) {
    apply();
    try { new MutationObserver(apply).observe(window.parent.document.documentElement, { attributes: true }); } catch {}
  }
})();
const Brain = (() => {
  let n = 0;
  const pending = new Map();
  addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    const m = e.data;
    if (!m || m.type !== 'reply' || !pending.has(m.request_id)) return;
    const { resolve, reject } = pending.get(m.request_id);
    pending.delete(m.request_id);
    m.ok ? resolve(m.result) : reject(m.error || { code: 'unknown' });
  });
  function call(type, payload) {
    return new Promise((resolve, reject) => {
      if (window.parent === window) {
        reject({ code: 'no_host', detail: 'Open this app from your brain to use it.' });
        return;
      }
      const id = 'r' + (++n) + '-' + Date.now();
      pending.set(id, { resolve, reject });
      window.parent.postMessage({ type, payload, request_id: id }, location.origin);
    });
  }
  return {
    ask: (messages, max_tokens) => call('llm.complete', max_tokens ? { messages, max_tokens } : { messages }),
    remember: (layer, content, metadata) => call('memory.write', { layer, content, metadata: metadata || {} }),
    info: () => call('meta.brain_info'),
  };
})();
function errText(e) {
  if (!e) return 'Something went wrong.';
  if (e.detail && typeof e.detail === 'string') return e.detail;
  return e.code ? 'Error: ' + e.code : String(e);
}
function setStatus(el, text, kind) { el.textContent = text; el.className = 'status' + (kind ? ' ' + kind : ''); }
function store(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function showSources(el, sources) {
  if (!sources || !sources.length) { el.textContent = ''; return; }
  const names = sources.map((s) => s.title || s.doc_name || s.source || s.document || JSON.stringify(s)).slice(0, 8);
  el.textContent = 'Sources: ' + names.join(', ');
}
const $ = (id) => document.getElementById(id);
const words = (s) => (s.trim().match(/\S+/g) || []).length;
$('pad').value = store('pad.text', '');
const upd = () => { $('count').textContent = words($('pad').value) + ' words'; };
$('pad').addEventListener('input', () => { save('pad.text', $('pad').value); upd(); });
upd();
let end = 0, tick = null;
function stopTimer(msg) { clearInterval(tick); tick = null; end = 0; $('timer').textContent = 'Start 25 min'; $('clock').textContent = msg || ''; }
$('timer').addEventListener('click', () => {
  if (tick) { stopTimer(''); return; }
  end = Date.now() + 25 * 60 * 1000; $('timer').textContent = 'Stop';
  tick = setInterval(() => {
    const left = Math.max(0, end - Date.now());
    const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    $('clock').textContent = `${m}:${String(s).padStart(2, '0')}`;
    if (!left) stopTimer('Time. Take a break.');
  }, 500);
});
$('keep').addEventListener('click', async () => {
  const text = $('pad').value.trim();
  if (!text) { setStatus($('status'), 'Nothing to save yet.', 'err'); return; }
  $('keep').disabled = true; setStatus($('status'), 'Saving...');
  try {
    const first = text.split('\n')[0].slice(0, 80);
    await Brain.remember('episodic', `Writing from Focus Pad (${new Date().toISOString().slice(0, 10)})\n\n${text}`, { app: 'focus-pad', title: first });
    setStatus($('status'), 'Saved to memory.', 'ok');
  } catch (e) { setStatus($('status'), errText(e), 'err'); }
  $('keep').disabled = false;
});
$('dl').addEventListener('click', () => {
  const blob = new Blob([$('pad').value], { type: 'text/markdown' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `pad-${new Date().toISOString().slice(0, 10)}.md`; a.click(); URL.revokeObjectURL(a.href);
});
$('clear').addEventListener('click', () => {
  if (!$('pad').value || confirm('Clear the pad? Download or save first if you want to keep it.')) { $('pad').value = ''; save('pad.text', ''); upd(); }
});
</script>
</body>
</html>
